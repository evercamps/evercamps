type Participant {
  participantId: Int!
  uuid: String!
  firstName: String!
  lastName: String!
  birthDate: String
  createdAt: Date!
  editUrl: String
  updateApi: String!
  deleteApi: String!
  registrations(filters: [FilterInput]): RegistrationCollection
  customer: Customer
  addCustomerUrl: String!
  removeCustomerUrl: String!
}

type ParticipantCollection {
  items: [Participant]
  currentPage: Int!
  total: Int!
  currentFilters: [Filter]
}

type ParticipantDuplicateGroup {
  key: String!
  score: Float!
  participants: [Participant!]!
}

extend type Query {
  participants(filters: [FilterInput]): ParticipantCollection
  participant(id: String): Participant
  participantDuplicateGroups(threshold: Float): [ParticipantDuplicateGroup!]!
}