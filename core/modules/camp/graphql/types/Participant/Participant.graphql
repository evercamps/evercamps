type Participant {
  participantId: Int!
  uuid: String!
  firstName: String!
  lastName: String!
  birthDate: String
  """
  Membership of the organiser's club, as declared when registering (ADR-0006)
  """
  membershipNumber: String
  createdAt: Date!
  editUrl: String
  updateApi: String!
  deleteApi: String!
  registrations(filters: [FilterInput]): RegistrationCollection
  customer: Customer
  addCustomerUrl: String!
  removeCustomerUrl: String!
}

type ParticipantCollection {
  items: [Participant]
  currentPage: Int!
  total: Int!
  currentFilters: [Filter]
}

extend type Query {
  participants(filters: [FilterInput]): ParticipantCollection
  participant(id: String): Participant
}