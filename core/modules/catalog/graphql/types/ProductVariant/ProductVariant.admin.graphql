"""
An attribute option chosen for a variant, e.g. kampweek = "Week 1 zomer 2027".
"""
type ProductVariantOption {
  attributeId: Int!
  attributeCode: String!
  attributeName: String!
  optionId: Int!
  optionText: String!
}

"""
A variant attribute whose options a product's variants can use: the variant
attributes of the product's attribute group, plus any attribute its variants
already use.
"""
type ProductVariantAttribute {
  attributeId: Int!
  attributeCode: String!
  attributeName: String!
  options: [AttributeOption!]!
}

extend type ProductVariant {
  options: [ProductVariantOption!]!
  """
  Registrations + order lines on this variant; a variant in use can't be deleted.
  """
  usageCount: Int!
  updateApi: String!
  deleteApi: String!
}

"""
The product's attribute group (decides which attributes the product and its
variants have, e.g. kampweek).
"""
type ProductVariantAttributeGroup {
  groupId: Int!
  groupName: String!
}

extend type Product {
  createVariantApi: String!
  variantAttributes: [ProductVariantAttribute!]!
  variantAttributeGroup: ProductVariantAttributeGroup
  """
  Whether the attribute group can still change (ADR-0003).
  """
  attributeGroupLock: AttributeGroupLock!
}

"""
A product's attribute group is locked once a variant has a value for a variant
attribute.
"""
type AttributeGroupLock {
  locked: Boolean!
  """
  The variant attributes in use, e.g. "Variants use Kampweek". Null when not locked.
  """
  reason: String
}
