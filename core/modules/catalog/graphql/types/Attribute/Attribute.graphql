"""
Represents a single attribute option
"""
type AttributeOption {
  attributeOptionId: ID!
  uuid: String!
  optionText: String!
  """
  Care period of the option (e.g. a camp week), YYYY-MM-DD. Null for options
  that aren't periods.
  """
  startDate: String
  endDate: String
  """
  Number of care days; null means "weekdays between start and end date".
  """
  dayCount: Int
}

"""
Represents a single attribute
"""
type Attribute {
  attributeId: ID!
  uuid: String!
  attributeCode: String!
  attributeName: String!
  type: String!
  isRequired: Int!
  displayOnFrontend: Int!
  sortOrder: Int!
  isFilterable: Int!
  options: [AttributeOption]
}

extend type Query {
  attribute(id: Int): Attribute
}
