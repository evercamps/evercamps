"""
Represents a product.
"""
type Product {
  productId: Int!
  uuid: String!
  name: String!
  status: Int!
  sku: String!
  weight: Weight!
  taxClass: Int
  """
  Member price a new variant starts with; a simple product mirrors it into its
  default variant. Null = no member price.
  """
  memberPrice: Price
  description: JSON
  urlKey: String
  metaTitle: String
  metaDescription: String
  metaKeywords: String
  "'simple' (one default variant, edited through the product fields) or 'configurable' (has its own variants)."
  type: String!
  visibility: Int
  manageRegistrations: Int
  groupId: ID
  url: String
}

"""
Returns a collection of products.
"""
type ProductCollection {
  items: [Product]
  currentPage: Int!
  total: Int!
  currentFilters: [Filter]
}

extend type Query {
  product(id: ID): Product
  products(filters: [FilterInput]): ProductCollection
  availableAttributes: [FilterAttribute]
  priceRange: PriceRange
}
